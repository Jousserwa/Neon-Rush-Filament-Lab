name: Filament Lab Android Build

on:
  push:
    branches: [main, stage2-public-integration]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build public Stage 2 Filament integration harness
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android API 37 and Build Tools
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Add Android API 37 SDK directory alias for AGP
        run: |
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Publish public lab test APK as a prerelease asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="stage2-public-lab-latest"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          NOTES="Public synthetic Filament integration harness only. This is not the production Neon Rush game and contains no production game source or credentials. For testing purposes only."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK" --title "Stage 2 Public Lab Test Build" --notes "$NOTES" --prerelease --repo "$GITHUB_REPOSITORY"
          fi
